name: publish-note-pages

on:
  workflow_dispatch: # Actionsタブから手動実行できる
  schedule:
    # cronはUTC。毎朝 JST 5:07 = UTC 20:07（前日）
    - cron: "7 20 * * *"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 掲載済み記事データのコミットバックに必要
      pages: read # configure-pagesがPages設定を確認するために必要
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsをセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Secretの設定を確認
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY が設定されていません（値は表示しません）"
            exit 1
          fi
          echo "必要なSecretは設定されています"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: RSS収集・要約・静的ページ生成を実行
        run: node src/index.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}

      - name: 掲載済み記事データをコミットバック
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --quiet -- data/site-items.json || (git add data/site-items.json && git commit -m "更新: GitHub Pages掲載記事" && git push)

      - name: GitHub Pagesを設定
        uses: actions/configure-pages@v5

      - name: GitHub Pages用ファイルをアップロード
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへ公開
        id: deployment
        uses: actions/deploy-pages@v4
